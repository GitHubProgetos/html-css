<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="shortcut icon" href="assets/html.ico" type="image/x-icon">
    <title>HEADER MODERN 2</title>
</head>
<body>

<nav class="menu">
    <ul>
      <li><a href="#" class="active">Início</a></li>
      <li><a href="#">Sobre</a></li>
      <li><a href="#">Serviços</a></li>
      <li><a href="#">Contato</a></li>
    </ul>
  <span class="hover-line"></span>
</nav>


<script>
  const menu = document.querySelector('.menu');
  const hoverLine = document.querySelector('.hover-line');
  const items = document.querySelectorAll('.menu ul li a');
  let activeItem = document.querySelector('.menu ul li a.active');

  function setLinePosition(target) {
    const coords = target.getBoundingClientRect();
    const menuCoords = menu.getBoundingClientRect();
    hoverLine.style.width = `${coords.width}px`;
    hoverLine.style.left = `${coords.left - menuCoords.left}px`;
  }

  // Inicializa a linha no item ativo
  if (activeItem) setLinePosition(activeItem);

  // Ao passar o mouse
  items.forEach(item => {
    item.addEventListener('mouseenter', () => setLinePosition(item));
    item.addEventListener('mouseleave', () => {
      if (activeItem) setLinePosition(activeItem);
    });
    // Se quiser trocar o item ativo ao clicar (opcional)
    
    item.addEventListener('click', () => {
      activeItem.classList.remove('active');
      item.classList.add('active');
      activeItem = item;
      setLinePosition(activeItem);
    });
    
  });
  
</script>


    
</body>
</html>
