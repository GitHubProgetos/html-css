<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/html.ico" type="image/x-icon">
    <title>Grid layout na prática 02</title>
    <style>
       div.container {
           border: 1px solid black;
           display: grid;
           height: 250px;

           grid-template-columns: auto auto auto;
           grid-template-rows: auto auto auto;
           grid-template: repeat(3,auto) / repeat(3,auto);/*shorthand primeiro para linhas e segundo para colunas*/ 

           gap: 5px;
           padding: 5px;
           border-radius: 5px;

           align-items: start;
           justify-items: center;
           place-items: start center;/*shorthand*/

           align-content: space-between;
           justify-content: end;
           place-content: space-between end;/*shorthand*/
        }

        div.item {
            border: 1px solid black;
            background-color: lightblue;
            display: grid;
            place-content: center;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>

    
</body>
</html>
