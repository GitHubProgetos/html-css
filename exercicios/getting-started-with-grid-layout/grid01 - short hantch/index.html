<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/html.ico" type="image/x-icon">
    <title>Grid layout na prática shortcut short hantch</title>
    <style>
    
        div.container {
           border: 1px solid black;
           display: grid;
            /*shorthand exemplo*/
           grid-template-columns: auto auto auto;
           grid-template-columns: repeat(3, auto);/*shorthand*/
           grid-template-columns: 1fr 1fr 1fr;/*shorthand 1fr = 1 fração | 1 fraction*/
            /*================================================*/
           grid-template-rows: 100px 100px 100px;
           grid-template-rows: repeat(3, 100px);/*shorthand*/
            /*================================================*/
           grid-template: 100px 100px 100px / auto auto auto;/*shorthand primero linhas depois colunas*/
           grid-template: repeat(3, 100px) / repeat(3, auto);/*shorthand*/
            /*================================================*/
           gap: 5px;
           padding: 5px;
           border-radius: 5px;
           grid-auto-rows: 100px;/*deixa as linhas iguais sempre que acrescentar uma linha nova.*/
           grid-auto-columns: 100px;/*deixa as colunas iguais sempre que acrescentar uma coluna nova.*/

           /*shorthand exemplo*/
           align-items: stretch;
           justify-items: center;
           place-items: stretch center;/*shorthand*/
           /*================================================*/ 
           /*shorthand exemplo*/
           align-content: start;
           justify-content: end;
           place-content: start end;/*shorthand*/
         }

        div.item {
            border: 1px solid black;
            background-color: lightblue;
            display: grid;
            place-content: center;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
    </div>

    
</body>
</html>
