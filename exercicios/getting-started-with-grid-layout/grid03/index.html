<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/html.ico" type="image/x-icon">
    <title>Grid layout na prática 03</title>
    <style>
       div.container {
           border: 1px solid black;
           display: grid;


           grid-template-columns: 120px 120px 120px;
           grid-template-columns: repeat(3,120px);
           grid-template-rows: 80px 80px 80px;
           grid-template-rows: repeat(3,80px);
           grid-template: repeat(3,80px) / repeat(3,120px);/*shorthand*/ 

           grid-auto-flow: column;/*Cria uma linha ou coluna automatica Altera a direção do grid auto rows e columns*/

           grid-auto-rows: 80px;
           grid-auto-columns: 120px;
           gap: 5px;
           padding: 5px;
           border-radius: 5px;

           align-items: normal;
           justify-items: normal;
           place-items: normal normal;/*shorthand*/

           align-content: normal;
           justify-content: normal;
           place-content: normal normal;/*shorthand*/
        }

        div.item {
            border: 1px solid black;
            background-color: lightblue;
            display: grid;
            place-content: center;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>

    
</body>
</html>
